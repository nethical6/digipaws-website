<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DigiPaws Has Moved — Now Available as Curbox</title>
  <meta name="description" content="DigiPaws has been discontinued. The app is now available as Curbox Switch to curbox.app today.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://curbox.app">

  <!-- Open Graph -->
  <meta property="og:title" content="DigiPaws Has Moved — Now Available as Curbox">
  <meta property="og:description" content="DigiPaws has been discontinued. Switch to Curbox, the new and improved digital wellbeing app.">
  <meta property="og:url" content="https://digipaws.life">
  <meta property="og:type" content="website">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="DigiPaws Has Moved — Now Curbox">
  <meta name="twitter:description" content="DigiPaws is discontinued. Visit curbox.app for the new and improved version.">

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "DigiPaws",
    "url": "https://digipaws.life",
    "description": "DigiPaws has been discontinued. Users are redirected to Curbox at curbox.app.",
    "sameAs": ["https://curbox.app"]
  }
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d0d;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 2rem;
      text-align: center;
    }

    .card {
      max-width: 560px;
      width: 100%;
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #ff6b6b;
      background: rgba(255, 107, 107, 0.12);
      border: 1px solid rgba(255, 107, 107, 0.3);
      border-radius: 100px;
      padding: 0.3rem 0.85rem;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 1rem;
      color: #ffffff;
    }

    p {
      font-size: 1.05rem;
      line-height: 1.7;
      color: #a0a0a0;
      margin-bottom: 2rem;
    }

    a.cta {
      display: inline-block;
      background: #ffffff;
      color: #0d0d0d;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      padding: 0.85rem 2rem;
      border-radius: 10px;
      transition: opacity 0.2s;
    }

    a.cta:hover { opacity: 0.85; }

    .sub {
      margin-top: 1.25rem;
      font-size: 0.85rem;
      color: #555;
    }

    .sub a {
      color: #777;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">Discontinued</div>

    <h1>DigiPaws has been discontinued.<br>Please switch to Curbox.</h1>

    <p>
      DigiPaws is no longer maintained or available for download.
      All development has moved to <strong style="color:#fff;">Curbox</strong>
    </p>

    <a class="cta" href="https://curbox.app" rel="noopener noreferrer">
      Go to curbox.app &rarr;
    </a>

    <p class="sub">
      <a href="https://curbox.app">https://curbox.app</a>
    </p>
  </main>
</body>
</html>
